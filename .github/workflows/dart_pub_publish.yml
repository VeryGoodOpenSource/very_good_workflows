name: Dart Pub Publish Workflow

on:
  workflow_call:
    inputs:
      dart_sdk:
        required: false
        type: string
        default: "stable"
        description: "The Dart SDK version to install before publishing."
      working_directory:
        required: false
        type: string
        default: "."
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      timeout_minutes:
        required: false
        type: number
        default: 5
      environment:
        required: false
        type: string
        default: ""
        description: "The GitHub deployment environment to run the publish job in."
    # Deprecated, will be used if passed in but using the "Setup Dart" action is recommended
    secrets:
      pub_credentials:
        required: false

jobs:
  publish:
    env:
      PUB_CREDENTIALS: ${{secrets.pub_credentials}}

    environment: ${{inputs.environment}}

    defaults:
      run:
        working-directory: ${{inputs.working_directory}}

    runs-on: ${{inputs.runs_on}}

    timeout-minutes: ${{inputs.timeout_minutes}}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{inputs.dart_sdk}}

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🔐 Setup Pub Credentials
        if: ${{ env.PUB_CREDENTIALS != '' }}
        run: |
          mkdir -p $XDG_CONFIG_HOME/dart
          echo "$PUB_CREDENTIALS" > "$XDG_CONFIG_HOME/dart/pub-credentials.json"

      - name: 🌵 Dry Run
        run: dart pub publish --dry-run

      - name: 📢 Publish
        run: dart pub publish -f
