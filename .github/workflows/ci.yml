name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-workflow-templates:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: test

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ✨ Check Formatting
        run: npm run format:check

      - name: 🕵️ Lint
        run: npm run lint

      - name: 🧪 Verify Workflow Templates
        run: npm test

  verify-dart:
    uses: ./.github/workflows/dart_package.yml
    with:
      setup: dart --version
      platform: "vm,chrome"
      working_directory: examples/dart_package
      artifact_name: dart-package-artifacts
      artifact_paths: examples/dart_package/coverage/lcov.info

  verify-flutter:
    uses: ./.github/workflows/flutter_package.yml
    with:
      flutter_channel: stable
      flutter_version: "3.47.x"
      setup: flutter doctor --verbose
      working_directory: examples/flutter_package
      artifact_name: flutter-package-artifacts
      artifact_paths: examples/flutter_package/coverage/lcov.info

  # Guards against shell-portability regressions in flutter_package.yml,
  # where Windows runners default to pwsh instead of bash.
  verify-flutter-windows:
    uses: ./.github/workflows/flutter_package.yml
    with:
      flutter_channel: stable
      flutter_version: "3.47.x"
      runs_on: windows-latest
      run_bloc_lint: false
      dart_define: "FLAVOR=staging API_URL=https://example.com"
      working_directory: examples/flutter_package

  verify-flutter-version-file:
    uses: ./.github/workflows/flutter_package.yml
    with:
      flutter_channel: stable
      flutter_version_file: examples/flutter_package/.fvmrc
      setup: flutter doctor --verbose
      working_directory: examples/flutter_package

  # `.fvmrc` and `fvm_config.json` are the only version files parsed without yq,
  # which Windows runners lack. This guards the documented Windows-safe path.
  verify-flutter-version-file-windows:
    uses: ./.github/workflows/flutter_package.yml
    with:
      flutter_channel: stable
      flutter_version_file: examples/flutter_package/.fvmrc
      runs_on: windows-latest
      run_bloc_lint: false
      working_directory: examples/flutter_package

  verify-pana-dart:
    uses: ./.github/workflows/pana.yml
    with:
      pana_version: 0.22.24
      min_score: 95
      working_directory: examples/dart_package

  verify-pana-flutter:
    uses: ./.github/workflows/pana.yml
    with:
      pana_version: 0.22.24
      min_score: 95
      working_directory: examples/flutter_package

  verify-skills-lint:
    uses: ./.github/workflows/skills_lint.yml
    with:
      working_directory: examples/skills_lint
      skills_directories: "skills"

  verify-semantic-pull-request:
    uses: ./.github/workflows/semantic_pull_request.yml
    with:
      scopes: |
        dart_package
        deps
        flutter_package
        pana
        semantic_pull_request
        skills_lint
        spell_check

  verify-spell-check:
    uses: ./.github/workflows/spell_check.yml
    with:
      modified_files_only: false

  verify-license-check:
    uses: ./.github/workflows/license_check.yml
    with:
      working_directory: examples/dart_package
      dependency_type: "direct-dev"
      allowed: ""
      forbidden: "unknown"
      skip_packages: "very_good_analysis"

  verify-license-check-flutter:
    uses: ./.github/workflows/license_check.yml
    with:
      working_directory: examples/flutter_package
      flutter_channel: stable
      flutter_version: "3.47.x"
      dependency_type: "direct-dev"
      allowed: ""
      forbidden: "unknown"
      skip_packages: "very_good_analysis"

  verify-license-check-flutter-version-file:
    uses: ./.github/workflows/license_check.yml
    with:
      working_directory: examples/flutter_package
      flutter_channel: stable
      flutter_version_file: examples/flutter_package/.fvmrc
      dependency_type: "direct-dev"
      allowed: ""
      forbidden: "unknown"
      skip_packages: "very_good_analysis"

  verify-artifacts:
    needs: [verify-dart, verify-flutter]

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded
          pattern: "*-package-artifacts"

      - name: 🔍 Verify Artifacts Are Not Empty
        # The templates upload with `if-no-files-found: ignore`, so a stale glob
        # would leave the upload step green with nothing attached.
        run: |
          for name in dart-package-artifacts flutter-package-artifacts; do
            file="downloaded/$name/lcov.info"
            if [ ! -s "$file" ]; then
              echo "::error::Expected a non-empty $file from the $name artifact"
              exit 1
            fi
            echo "OK: $file ($(wc -c < "$file") bytes)"
          done

  build:
    needs:
      [
        verify-workflow-templates,
        verify-dart,
        verify-flutter,
        verify-flutter-windows,
        verify-flutter-version-file,
        verify-flutter-version-file-windows,
        verify-artifacts,
        verify-pana-dart,
        verify-pana-flutter,
        verify-skills-lint,
        verify-semantic-pull-request,
        verify-spell-check,
        verify-license-check,
        verify-license-check-flutter,
        verify-license-check-flutter-version-file,
      ]

    runs-on: ubuntu-latest

    steps:
      - name: noop
        run: echo 'noop'
